name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint, Typecheck & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: |
          uv pip install --system -e "./backend[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check backend/src backend/tests

      - name: Run Mypy Typechecker
        run: |
          mypy backend/src

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -m "not live_library and not live_credentials and not live_qwen and not live_v01"

  frontend:
    name: Frontend Typecheck, Test & Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: web
        run: npm run typecheck

      - name: Run Vitest Suite
        working-directory: web
        run: npm test

      - name: Build production bundle
        working-directory: web
        run: npm run build
