[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-workbench"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.51.0",
  "watchfiles==1.2.0",
  "PyMuPDF==1.28.0",
  "keyring==25.7.0",
  "httpx==0.28.1",
  "tenacity==9.1.4",
  "psutil==7.2.2",
  "filelock==3.29.7",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.15.21",
  "mypy==2.3.0",
]

[project.scripts]
literature-workbench = "literature_workbench.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not live_library and not live_credentials and not live_qwen and not live_v01' --strict-markers"
markers = [
  "live_library: read-only checks against the real approved PDF library",
  "live_credentials: isolated test entry in Windows Credential Manager",
  "live_qwen: verified local Qwen process and transport smoke test",
  "live_v01: full opt-in v0.1 integration gate",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
